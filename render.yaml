services:
  - type: web
    name: sme-django-webapp
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn SME_DjangoWebApp.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"
