<h1>Registered Students</h1>
<a href="{% url 'student_list' %}">Register Student</a>
<a href="{% url 'student_dashboard' %}">Student Dashboard
</a>
<br><br>


<table border="1" cellpadding="8" cellspacing="0">
    <tr>
        <th>Name</th>
        <th>Program</th>
        <th>Year</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    {% for student in students %}
    <tr>
        <td>{{ student.student_name }}</td>
        <td>{{ student.program }}</td>
        <td>{{ student.year_level }}</td>
        <td>{{ student.email }}</td>
        <td>
            <a href="{% url 'student_update' student.id %}">Edit</a> |
            <a href="{% url 'student_delete' student.id %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No registered students yet.</td>
    </tr>
    {% endfor %}
</table>
